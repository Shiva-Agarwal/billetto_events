default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i + ENV.fetch("SIDEKIQ_CONCURRENCY", 0).to_i %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", ENV.fetch("USER", "postgres")) %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: billetto_events_development

test:
  <<: *default
  database: billetto_events_test<%= ENV["TEST_ENV_NUMBER"] %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
